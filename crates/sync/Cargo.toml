[package]
name = "oxymail-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
futures = "0.3.34"
hickory-resolver = "0.26.3"
keyring = "4.2.0"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "ring", "webpki-roots"] }
mail-builder = "1.0.0"
oxymail-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.10"
