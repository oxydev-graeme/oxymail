# Builds, signs and publishes OxyMail for Windows, macOS and Linux when a version tag (v1.2.3)
# is pushed. The release holds every installer, its updater signature, and latest.json, which
# installed copies on all three platforms read to update themselves.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            # One app for both Apple Silicon and Intel Macs.
            args: "--target universal-apple-darwin"
          # The oldest supported Ubuntu, so the Linux builds run on older glibc too.
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - name: Frontend dependencies
        working-directory: app
        run: npm ci

      - name: Test
        run: cargo test -p oxymail-core -p oxymail-sync -p oxymail-mailbird-export

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: OxyMail ${{ github.ref_name }}
          releaseBody: |
            **Windows:** run `OxyMail_*_x64-setup.exe` (no administrator rights needed), or use the `.msi`.
            **macOS:** open the `.dmg` and drag OxyMail to Applications. The first time, right-click → Open.
            **Linux:** the AppImage (make it executable, then run it), the `.deb` (`sudo apt install ./OxyMail_*.deb`), or the `.rpm`.

            Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
