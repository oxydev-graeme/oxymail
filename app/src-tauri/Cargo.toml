[package]
name = "oxymail-app"
version = "0.3.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oxymail-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
oxymail-sync = { version = "0.1.0", path = "../../crates/sync" }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["time"] }
tauri-plugin-notification = "2.7.0"
base64 = "0.23.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
dirs = "7.0.0"
open = "5.4.4"

# The binary name is the Wayland app id, which must match oxymail.desktop for the icon to show.
[[bin]]
name = "oxymail"
path = "src/main.rs"
