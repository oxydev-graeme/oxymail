<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Oxymail</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23264A"/>
      <stop offset="1" stop-color="#14162E"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ADCFF"/>
      <stop offset="1" stop-color="#38B6F0"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC069"/>
      <stop offset="1" stop-color="#FE9A00"/>
    </linearGradient>
    <linearGradient id="c3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F57AB4"/>
      <stop offset="1" stop-color="#D63F8C"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B08CFF"/>
      <stop offset="1" stop-color="#7B4DE8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke-width="64" stroke-linecap="round">
    <!-- back layer: the two legs -->
    <rect x="96" y="120" width="64" height="272" rx="32" fill="url(#c1)" stroke="none" filter="url(#shadow)"/>
    <rect x="352" y="120" width="64" height="272" rx="32" fill="url(#c4)" stroke="none" filter="url(#shadow)"/>
    <!-- front layer: the diagonals, the right one crossing over the left at the centre -->
    <line x1="128" y1="152" x2="256" y2="304" stroke="url(#c2)" filter="url(#shadow)"/>
    <line x1="384" y1="152" x2="256" y2="304" stroke="url(#c3)" filter="url(#shadow)"/>
  </g>
</svg>
